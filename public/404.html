<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada · NVUP</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <style>
      *,
      *::before,
      *::after { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f4f4f5;
        background:
          radial-gradient(60% 50% at 50% 42%, rgba(255, 255, 255, 0.10), transparent 70%),
          radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1.4px) 0 0 / 6px 6px,
          #000;
        font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { text-align: center; max-width: 520px; }
      .mark { width: 56px; height: 56px; margin: 0 auto 28px; border-radius: 14px; display: block; }
      .code {
        margin: 0;
        font-size: clamp(88px, 22vw, 168px);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 0.9;
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.85);
      }
      h1 { margin: 22px 0 10px; font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 0 0 30px; color: rgba(244, 244, 245, 0.62); font-size: 16px; line-height: 1.55; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a.btn {
        display: inline-flex;
        align-items: center;
        padding: 14px 24px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        color: #000;
        background: #f4f4f5;
        border: 1px solid #f4f4f5;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      a.btn:hover { transform: translateY(-2px); }
      a.btn--ghost { color: #f4f4f5; background: transparent; border-color: rgba(255, 255, 255, 0.28); }
      a.btn--ghost:hover { background: rgba(255, 255, 255, 0.08); }
      a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } a.btn:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon-192.png" width="56" height="56" alt="NVUP" />
      <p class="code" aria-hidden="true">404</p>
      <h1>Essa cena não existe.</h1>
      <p>O endereço que você abriu não foi encontrado. Volte pro início ou peça um orçamento.</p>
      <div class="actions">
        <a class="btn" href="/">Voltar ao início</a>
        <a class="btn btn--ghost" href="/#contato">Pedir orçamento</a>
      </div>
    </main>
  </body>
</html>
